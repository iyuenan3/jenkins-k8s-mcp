[project]
name = "jenkins-k8s-mcp"
version = "0.1.0"
description = "Configurable Jenkins and Kubernetes management MCP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "mcp==1.29.0",
  "httpx>=0.28.1,<0.29",
  "kubernetes>=34,<38",
  "pydantic>=2.11,<3",
  "PyYAML>=6.0.2,<7",
  "lxml>=5,<7",
  "uvicorn>=0.30,<1",
]

[project.scripts]
jenkins-k8s-mcp = "jenkins_k8s_mcp.cli:main"

[dependency-groups]
dev = ["pytest>=8.4,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jenkins_k8s_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv]
cache-keys = [{file = "pyproject.toml"}, {file = "src/**/*.py"}]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ASYNC"]
